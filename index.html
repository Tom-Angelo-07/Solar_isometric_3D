<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>โซลาร์เซลล์ 3 ประเภท · เกาะจำลอง 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14283A;--ink2:#566A7E;--on:#F2A93B;--off:#22B26A;--hyb:#6577D9;--bad:#E5484D;--accent:#F2A93B;--accent-soft:rgba(242,169,59,.28);--sky-top:#BFE6F2;--sky-bot:#F4FBFC;--dockH:260px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#CDEBF3;color:var(--ink);font-family:'Prompt','Noto Sans Thai','Sarabun','Thonburi','Leelawadee UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 26px rgba(20,40,58,.15)}

#sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
#stars{position:fixed;inset:0;opacity:0;pointer-events:none;background-image:
radial-gradient(1.6px 1.6px at 8% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 28%,#fff,transparent),radial-gradient(1.8px 1.8px at 35% 8%,#fff,transparent),
radial-gradient(1.2px 1.2px at 48% 22%,#fff,transparent),radial-gradient(1.6px 1.6px at 61% 11%,#fff,transparent),radial-gradient(1.2px 1.2px at 74% 30%,#fff,transparent),
radial-gradient(1.8px 1.8px at 86% 14%,#fff,transparent),radial-gradient(1.2px 1.2px at 93% 26%,#fff,transparent),radial-gradient(1.4px 1.4px at 15% 44%,#fff,transparent),
radial-gradient(1.2px 1.2px at 55% 40%,#fff,transparent),radial-gradient(1.4px 1.4px at 80% 46%,#fff,transparent),radial-gradient(1.2px 1.2px at 30% 52%,#fff,transparent)}
.orb{position:fixed;left:0;top:0;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;pointer-events:none;will-change:transform,opacity}
#sunorb{background:radial-gradient(circle,#FFFBE0 0 30%,#FFD45C 52%,rgba(255,212,92,0) 70%)}
#moonorb{background:radial-gradient(circle at 40% 40%,#FFFFFF 0 34%,#DDE5FF 46%,rgba(200,215,255,.0) 70%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:11.5px;font-weight:600;line-height:1.2;padding:4px 9px;border-radius:11px;background:#fff;color:var(--ink);box-shadow:0 5px 14px rgba(20,40,58,.2);will-change:transform;transition:opacity .25s}
.tag.hide{opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.tag svg.i{width:14px;height:14px}
.tag.free{background:#22B26A;color:#fff;font-size:13px;padding:5px 11px}
.tag.bad{background:var(--bad);color:#fff}
.tag.big{font-size:14px;padding:7px 13px;border-radius:14px;color:#fff}
.tag.ring{padding:3px 10px 3px 4px}
.tag.ring svg{width:30px;height:30px}

#top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.row1>*{pointer-events:auto}
.ttl{border-radius:14px;padding:6px 12px;line-height:1.2}
.ttl b{display:block;font-size:15px;font-weight:700}
.ttl span{font-size:12px;color:var(--ink2)}
.tools{display:flex;gap:6px}
.rb{width:40px;height:40px;border-radius:13px;border:0;display:grid;place-items:center;color:var(--ink)}
.rb.on{background:var(--ink);color:#fff}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;border-bottom:4px solid var(--c);border-radius:14px;padding:7px 4px 6px;font-weight:700;font-size:14px;line-height:1.15;background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 6px 16px rgba(20,40,58,.13);transition:background .25s,color .25s,transform .2s}
.tab small{display:block;font-weight:500;font-size:11px;opacity:.78}
.tab.on{background:var(--c);color:var(--tc);transform:translateY(-1px)}

#toast{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top));transform:translate(-50%,-8px);max-width:calc(100% - 28px);padding:8px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,0)}

#dock{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(580px,calc(100% - 16px));border-radius:24px;padding:10px;z-index:5}
.st{display:flex;gap:9px;align-items:flex-start;padding:2px 4px 8px}
.st .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.stt{flex:1;min-width:0}
.stt p{margin:0;font-size:11.5px;color:var(--ink2);line-height:1.35}
.stt b{display:block;font-size:13.5px;line-height:1.3;margin-top:1px}
.money{flex:none;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:11px;background:var(--accent-soft);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money svg{width:15px;height:15px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g{border-radius:14px;padding:7px 4px 6px;background:rgba(20,40,58,.055);text-align:center;transition:background .3s}
.g svg{width:17px;height:17px;color:var(--ink2)}
.g strong{display:block;font-size:15.5px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.g span{display:block;font-size:10.5px;color:var(--ink2);line-height:1.25}
.g.warn{background:rgba(229,72,77,.14)}
.leg{display:flex;gap:12px;justify-content:center;font-size:10.5px;color:var(--ink2);padding:7px 0 0}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-0px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.btn{border:0;border-radius:12px;height:38px;padding:0 12px;font-weight:600;font-size:13px;background:rgba(20,40,58,.07);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.btn svg{width:17px;height:17px}
.btn.on{background:var(--ink);color:#fff}
.btn.alert.on{background:var(--bad)}
.btn.sm{padding:0 10px;min-width:48px}
.btn.grow{flex:1}
.pb{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.pb svg{width:16px;height:16px;fill:#fff}
.clk{font-size:12.5px;font-weight:600;min-width:84px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.clk small{display:block;font-weight:400;color:var(--ink2);font-size:10.5px}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;flex:1;margin:0;min-width:0;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,#1B2A5C 0%,#4A5FA8 18%,#F7B26A 27%,#FFE9A8 50%,#F7B26A 73%,#4A5FA8 82%,#1B2A5C 100%)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:linear-gradient(90deg,#1B2A5C 0%,#4A5FA8 18%,#F7B26A 27%,#FFE9A8 50%,#F7B26A 73%,#4A5FA8 82%,#1B2A5C 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.seg{display:flex;background:rgba(20,40,58,.07);border-radius:12px;padding:3px;gap:2px}
.seg button{width:42px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--ink2);display:grid;place-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(20,40,58,.18)}
#fold{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:44px;height:22px;border:0;border-radius:11px 11px 0 0;display:grid;place-items:center;background:rgba(255,255,255,.86);color:var(--ink2);box-shadow:0 -4px 10px rgba(20,40,58,.08)}
#fold svg{width:16px;height:16px;transition:transform .3s}
#dock.min .more{display:none}
#dock.min #fold svg{transform:rotate(180deg)}

#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 20px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 20px));border-radius:18px;padding:12px 40px 12px 14px;z-index:6;border-left:5px solid var(--accent)}
#info[hidden]{display:none}
#info b{font-size:14.5px}
#info p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink2)}
#info .lv{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--ink)}
#infoX{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink2)}

#sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.85,.2,1)}
#sheet.open{transform:none}
#sheet .panel{pointer-events:auto;position:relative;width:min(640px,100%);max-height:84vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(255,255,255,.98);border-radius:26px 26px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(20,40,58,.28);-webkit-user-select:text;user-select:text}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(20,40,58,.2);margin:0 auto 10px}
#sheetX{position:absolute;right:12px;top:14px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(20,40,58,.07);display:grid;place-items:center}
.panel h3{margin:0 40px 4px 0;font-size:18px}
.panel .sub{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.tbl{display:grid;grid-template-columns:.95fr .95fr .8fr 1.6fr;gap:4px;font-size:12px}
.tbl>div{padding:9px 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.tbl .h{font-weight:700;color:#fff;font-size:11.5px}
.tbl .h0{background:#D9DEE5;color:var(--ink)}.tbl .h1{background:#F2A93B;color:#2E1F05}.tbl .h2{background:#22B26A}.tbl .h3{background:#6577D9}
.tbl .c2{background:#FDEBC8}.tbl .c3{background:#CDEFDD}.tbl .c4{background:#DDE0F7}
.tbl .rl{font-weight:700}
.tbl [data-m]{cursor:pointer}
.tbl .act{box-shadow:inset 0 0 0 2.5px var(--ink)}
.cards{display:grid;gap:10px;margin-top:14px}
.card{border-radius:16px;overflow:hidden;background:#F5F8FA;border:1px solid rgba(20,40,58,.08)}
.card h4{margin:0;padding:8px 14px;font-size:14px}
.card h4 small{font-weight:500;opacity:.85;margin-left:4px}
.card dl{margin:0;padding:8px 14px 4px}
.card dt{font-size:11px;font-weight:700;color:var(--ink2);margin-top:6px}
.card dd{margin:1px 0 0;font-size:13px;line-height:1.45}
.card .btn{margin:6px 14px 12px}
.q{margin:6px 0 14px}
.q h5{margin:0 0 8px;font-size:14px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid rgba(20,40,58,.12);background:#fff;border-radius:13px;padding:9px 14px;font-weight:600;font-size:13px}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.res{border-radius:18px;padding:14px;color:#fff;margin-top:8px}
.res h4{margin:0 0 4px;font-size:17px}
.res p{margin:4px 0;font-size:13px;line-height:1.5}
.res .btn{margin-top:8px;background:#fff;color:var(--ink)}
.cl{margin:14px 0}
.cl label{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.cl label output{font-variant-numeric:tabular-nums;color:var(--on);filter:saturate(1.2) brightness(.8)}
.cl input[type=range]{width:100%}
.cl input[type=range]::-webkit-slider-runnable-track{background:rgba(20,40,58,.12)}
.cl input[type=range]::-moz-range-track{background:rgba(20,40,58,.12)}
.big{font-size:40px;font-weight:700;line-height:1;margin:6px 0 2px}
.note{font-size:11.5px;color:var(--ink2);line-height:1.5;margin-top:10px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:5px}
.lc{border-radius:12px;padding:5px 6px;text-align:center;background:rgba(20,40,58,.055)}
.lc span{display:block;font-size:10.5px;color:var(--ink2);line-height:1.2}
.lc b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.lc.buy b{color:#C23A3F}.lc.sell b{color:#14884F}
.rate{font-size:10.5px;color:var(--ink2);text-align:center;margin:0 0 7px;line-height:1.35}
.money.pos{background:rgba(34,178,106,.2);color:#0E6B3E}.money.neg{background:rgba(229,72,77,.18);color:#A32A2F}
.pop{position:absolute;left:0;top:0;font-weight:700;font-size:15px;pointer-events:none;text-shadow:0 1px 0 #fff,0 0 6px #fff;animation:pop 1.5s ease-out forwards}
.pop.p{color:#14884F}.pop.m{color:#D63C42}
@keyframes pop{0%{opacity:0;transform:translate(var(--x),var(--y)) translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) - 64px)) translate(-50%,0)}}
.fopts{display:grid;gap:8px;margin-bottom:6px}
.fo{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid rgba(20,40,58,.12);background:#fff;border-radius:14px;padding:10px 12px;width:100%}
.fo.on{border-color:var(--bad);background:rgba(229,72,77,.08)}
.fo b{display:block;font-size:13.5px}.fo small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.35}
.fo svg{color:var(--bad);width:22px;height:22px}
.out{border-radius:14px;padding:10px 12px;margin-top:8px}
.out h5{margin:0 0 3px;font-size:13.5px}.out p{margin:2px 0;font-size:12.5px;line-height:1.45}.out .mini{font-size:11.5px;opacity:.92;font-weight:600}
.bar{height:8px;border-radius:4px;background:rgba(20,40,58,.12);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--hyb)}
.tech{margin-top:12px;padding:10px 12px;border-radius:14px;background:#F5F8FA;font-size:12.5px;line-height:1.5}
.tech .btn{margin-top:8px;width:100%}
.fail{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;z-index:50;background:#CDEBF3;font-size:15px;line-height:1.6}
@media (min-width:900px){#top{padding-left:24px;padding-right:24px}#tabs{max-width:560px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="sky"></div><div id="stars"></div><div class="orb" id="sunorb"></div><div class="orb" id="moonorb"></div>
<canvas id="c" aria-label="ฉาก 3 มิติแบบ isometric ของระบบโซลาร์เซลล์ 3 ประเภท"></canvas>
<div id="labels"></div>

<header id="top">
<div class="row1">
<div class="ttl glass"><b>โซลาร์เซลล์ 3 ประเภท</b><span>เลือกแบบไหนคุ้มที่สุด?</span></div>
<div class="tools">
<button class="rb glass" id="rotL" aria-label="หมุนมุมมองไปทางซ้าย"></button>
<button class="rb glass" id="rotR" aria-label="หมุนมุมมองไปทางขวา"></button>
<button class="rb glass" id="ovBtn" aria-label="ดูทั้งสามเกาะพร้อมกัน"></button>
</div>
</div>
<nav id="tabs" role="tablist"></nav>
</header>
<div id="toast"></div>

<div id="info" class="glass" hidden>
<button id="infoX" aria-label="ปิด"></button>
<b id="infoT"></b><p id="infoD"></p><div class="lv" id="infoL"></div>
</div>

<section id="dock" class="glass">
<button id="fold" aria-label="ย่อหรือขยายแผงควบคุม"></button>
<div class="st"><span class="dot"></span><div class="stt"><p id="prin"></p><b id="live"></b></div><div class="money" id="money"></div></div>
<div class="ledger" id="ledger"></div><div class="rate" id="rate"></div>
<div class="gauges" id="gauges"></div>
<div class="more">
<div class="leg"><span><i style="background:#FFC21A"></i>ไฟจากแดด</span><span><i style="background:#6C7A99"></i>ไฟหลวง</span><span><i style="background:#2FD08B"></i>ไฟจากแบตเตอรี่</span></div>
<div class="row">
<button class="pb" id="play" aria-label="เล่นหรือหยุดเวลา"></button>
<input id="tm" type="range" min="0" max="24" step="0.01" value="9.5" aria-label="เวลาในหนึ่งวัน">
<div class="clk" id="clk"></div>
<button class="btn sm" id="spd" aria-label="ความเร็วเวลา">×1</button>
</div>
<div class="row">
<div class="seg" id="wx">
<button data-w="clear" aria-label="ท้องฟ้าโปร่ง"></button>
<button data-w="cloud" aria-label="เมฆมาก"></button>
<button data-w="rain" aria-label="ฝนตก"></button>
</div>
<button class="btn alert grow" id="blk"></button>
</div>
<div class="row">
<button class="btn grow" data-sheet="cmp"></button>
<button class="btn grow" data-sheet="quiz"></button>
<button class="btn grow" data-sheet="calc"></button>
</div>
<div class="row"><button class="btn alert grow" id="fltBtn"></button></div>
</div>
</section>

<div id="sheet" aria-hidden="true"><div class="panel"><div class="grab"></div><button id="sheetX" aria-label="ปิด"></button><div id="sheetBody"></div></div></div>
<div class="fail" id="fail">อุปกรณ์นี้เปิดฉาก 3 มิติไม่ได้<br>ลองเปิดไฟล์นี้ในเบราว์เซอร์ที่รองรับ WebGL</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.getElementById('fail').style.display='grid';return}

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const baht=n=>(Math.round(n)<0?'−':'')+'฿'+Math.abs(Math.round(n)).toLocaleString('en-US');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON={
sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
cloud:'<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
rain:'<path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>',
bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
bat:'<rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 13v-2"/>',

function calcHTML(){return `<h3>คิดเวลาคืนทุน</h3><p class="sub">ระบบออนกริด 10 kW · ปรับค่าแล้วดูผลทันที</p>
<div class="cl"><label>ค่าไฟต่อหน่วย<output id="oT"></output></label><input type="range" id="cT" min="3" max="7" step="0.01" value="${S.tariff}"></div>

<div class="cl"><label>ราคาติดตั้งต่อ kW<output id="oC"></output></label><input type="range" id="cC" min="20000" max="40000" step="500" value="27000"></div>
<div class="big" id="cY"></div><div id="cM" style="font-size:13px;font-weight:600"></div><svg class="chart" id="cG" viewBox="0 0 320 150"></svg>
<p class="note">ตัวเลขจำลองเพื่อการเรียนรู้ ใช้ผลิตเฉลี่ย 4.2 หน่วย/kW/วัน ค่าไฟเริ่มต้น 4.13 บาท (ค่าไฟเฉลี่ย 3.86 + VAT 7% งวด ก.ย.–ธ.ค. 2569) และราคารับซื้อไฟคืน ${S.exportRate} บาท/หน่วย ไม่ใช่ใบเสนอราคา ราคาจริงขึ้นกับพื้นที่และเงื่อนไขการขายไฟคืน</p>`}
function calcUpdate(){const t=+$('#cT').value,s=+$('#cS').value/100,c=+$('#cC').value,kw=10,ann=kw*4.2*365*(s*t+(1-s)*S.exportRate),cost=kw*c,y=cost/ann;
$('#oT').textContent=t.toFixed(2)+' บาท';$('#oS').textContent=Math.round(s*100)+'%';$('#oC').textContent=baht(c);
$('#cY').textContent='≈ '+y.toFixed(1)+' ปี';$('#cM').textContent=(y>=3&&y<=5?'อยู่ในช่วง 3–5 ปี ตามที่ออนกริดมักคืนทุน':y<3?'คืนทุนเร็วกว่าปกติ':'ช้ากว่าช่วง 3–5 ปี ลองใช้ไฟกลางวันให้มากขึ้นหรือลดต้นทุนติดตั้ง')+' · ประหยัดปีละ '+baht(ann);
const X=yr=>20+yr/12*290,ym=ann*12*1.05,Y=val=>130-val/ym*115,col=MODE.on.col;
$('#cG').innerHTML=`<rect x="${X(3)}" y="10" width="${X(5)-X(3)}" height="120" fill="${col}" opacity=".18"/><path d="M20 130H310M20 10V130" stroke="#C7D0DA" fill="none"/><path d="M${X(0)} 130L${X(12)} ${Y(ann*12)}" stroke="#14283A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M20 ${Y(cost)}H310" stroke="#E5484D" stroke-width="2" stroke-dasharray="5 4" fill="none"/><circle cx="${X(Math.min(y,12))}" cy="${Y(cost)}" r="6" fill="${col}" stroke="#14283A" stroke-width="2.5"/><g font-size="10" fill="#566A7E" font-family="inherit"><text x="20" y="144">0</text><text x="${X(3)}" y="144" text-anchor="middle">3</text><text x="${X(5)}" y="144" text-anchor="middle">5</text><text x="${X(12)}" y="144" text-anchor="end">12 ปี</text><text x="312" y="${Y(cost)-5}" text-anchor="end" fill="#E5484D">ต้นทุน ${baht(cost)}</text><text x="${X(12)-4}" y="${Y(ann*12)+14}" text-anchor="end" fill="#14283A">ประหยัดสะสม</text></g>`}
$('#sheetBody').addEventListener('input',e=>{if(e.target.closest('.cl'))calcUpdate()});
$('#sheetBody').addEventListener('click',e=>{const go=e.target.closest('[data-go]'),m=e.target.closest('[data-m]'),q=e.target.closest('[data-q]');
if(go){closeSheet();setMode(go.dataset.go);return}
if(q){const k=q.dataset.q;quiz[k]=q.dataset.v;if(k==='a'){delete quiz.b;delete quiz.c}if(k==='b')delete quiz.c;$('#sheetBody').innerHTML=quizHTML();return}
if(m&&curSheet==='cmp'){setMode(m.dataset.m,true);$('#sheetBody').innerHTML=cmpHTML()}});

/* ---- fault simulation ---- */
function faultOut(m){const F=S.fault,o=S.out;
const T={
inv:{on:o?'ไฟหลวงดับด้วย → ไฟดับทั้งหมด แผงก็ผลิตไฟไม่ได้':'ไฟยังมีใช้ เพราะไฟหลวงจ่ายแทน แต่แผงผลิตไฟไม่ได้ ต้องซื้อไฟเต็มราคาและไม่มีไฟขายคืน',
off:'ไฟดับทั้งหลัง เพราะไฟทุกดวงผ่านอินเวอร์เตอร์ตัวนี้ และไม่มีไฟหลวงสำรอง ต้องรอช่าง',
hyb:o?'ไฟหลวงดับด้วย → ไฟดับ แบตสำรองก็จ่ายไฟไม่ได้เมื่ออินเวอร์เตอร์เสีย':'สลับไปใช้ไฟหลวงผ่านสวิตช์บายพาส (สมมติว่าติดตั้งไว้) ไฟยังมี แต่แผงและแบตใช้ไม่ได้ ต้องซื้อไฟเต็มราคา'},
pv:{on:'ผลิตไฟได้เหลือราว 30% ต้องซื้อไฟหลวงเพิ่ม ค่าไฟพุ่ง และขายคืนได้น้อยลง',off:'ผลิตไม่พอเติมแบต แบตหมดเร็ว กลางคืนหรือวันฝนตกอาจไฟดับ',hyb:'ผลิตเหลือราว 30% ซื้อไฟหลวงเพิ่ม แต่แบตยังช่วยได้และยังมีไฟสำรองเมื่อไฟดับ'},
bat:{on:'ออนกริดไม่มีแบตเตอรี่ จึงไม่ได้รับผลกระทบ',off:'ใช้ไฟได้เฉพาะตอนแดดออก กลางคืนไฟดับ เพราะเก็บไฟไม่ได้',hyb:o?'ไฟหลวงดับและแบตเสีย → ไม่มีไฟสำรอง ไฟดับ':'ทำงานเหมือนออนกริด ซื้อ-ขายไฟหลวงได้ปกติ แต่ถ้าไฟหลวงดับจะไม่มีไฟสำรอง'}};
return T[F][m]}
function faultLine(m){const F=S.fault;if(!F)return'';const s=SIM[m],o=S.out;
if(F==='inv'){if(m==='on')return o?'ไฟหลวงดับและอินเวอร์เตอร์เสีย · ไฟดับทั้งหมด':`อินเวอร์เตอร์เสีย · ใช้ไฟหลวงแทน ${f1(Math.max(0,s.grid))} kW (ซื้อเต็มราคา)`;
if(m==='off')return'อินเวอร์เตอร์เสีย · ไฟดับทั้งหลัง ไม่มีไฟหลวงสำรอง';return o?'ไฟหลวงดับและอินเวอร์เตอร์เสีย · ไฟดับ':`อินเวอร์เตอร์เสีย · ใช้ไฟหลวงผ่านบายพาส ${f1(Math.max(0,s.grid))} kW`}
if(F==='pv'){if(m==='off')return s.served<.9?'แผงเสีย · แบตหมด ไฟไม่พอใช้':`แผงเสีย · ผลิตเหลือราว 30% · แบต ${Math.round(s.soc*100)}%`;
return 'แผงเสีย · ผลิตเหลือราว 30%'+(s.grid>.1?` · ซื้อไฟหลวง ${f1(s.grid)} kW`:'')}
if(F==='bat'){if(m==='on')return'';if(m==='off')return s.pv>.1?'แบตเสีย · ใช้ไฟตรงจากแผงได้เท่านั้น':'แบตเสีย · ไม่มีแดด ไฟดับ';
return o?'ไฟหลวงดับและแบตเสีย · ไม่มีไฟสำรอง ไฟดับ':'แบตเสีย · ทำงานเหมือนออนกริด ไม่มีไฟสำรอง'}
return''}
function syncFault(){const b=$('#fltBtn'),F=S.fault;b.innerHTML=ic('warn')+(F?`<span>ระบบเสีย: ${REP[F].n}${S.tech?` · ช่างอีก ${Math.ceil(S.tech.left)} ชม.`:' · แตะเพื่อจัดการ'}</span>`:'<span>จำลองระบบโซลาร์เสีย</span>');b.classList.toggle('on',!!F)}
function faultLive(){const F=S.fault;if(!F)return'<p class="note">เลือกอาการด้านบน เพื่อดูว่าแต่ละระบบจะเจออะไร และเงินจะเปลี่ยนไปอย่างไร</p>';
const r=REP[F],costs=ORDER.filter(m=>r.c[m]).map(m=>`${MODE[m].name} ${baht(r.c[m])}`).join(' · ');
const tech=S.tech?`<div class="tech"><b>ช่างกำลังเดินทาง</b> · อีกราว ${Math.ceil(S.tech.left)} ชม. (เวลาในเกม)<div class="bar"><i style="width:${clamp(1-S.tech.left/S.tech.total)*100}%"></i></div></div>`
:`<div class="tech">ซ่อมให้กลับมาใช้งานได้ ช่างถึงใน ~${r.h} ชม. (เวลาในเกม)<br>ค่าซ่อมตัวอย่าง: ${costs}<button class="btn on" data-tech="1">${ic('tool')}เรียกช่างซ่อม</button></div>`;
const rows=ORDER.map(m=>{const d=MODE[m],L=LG[m];const ex=m==='off'?`ชั่วโมงที่ไฟไม่พอ (สะสม) ${f1(L.dark)} ชม.`:`ค่าไฟหลวงที่จ่ายตั้งแต่เสีย ${baht(L.fBuy)} · ขายคืนได้ ${baht(L.fSell)}`;
return `<div class="out" style="background:${d.col};color:${d.tc}"><h5>${d.name} (${d.en})</h5><p>${faultOut(m)}</p><p class="mini">${ex}</p></div>`}).join('');
return tech+rows}
function faultHTML(){const F=S.fault;
const opts=Object.keys(REP).map(k=>`<button class="fo${F===k?' on':''}" data-f="${k}">${ic('warn')}<div><b>${REP[k].n}</b><small>${REP[k].s}</small></div></button>`).join('');
return `<h3>จำลองระบบโซลาร์เสีย</h3><p class="sub">เลือกอาการ แล้วดูว่าทั้ง 3 ระบบเจออะไร แตะซ้ำเพื่อยกเลิก</p><div class="fopts">${opts}</div><div id="fltLive">${faultLive()}</div><p class="note">ค่าซ่อมและเวลาช่างเป็นตัวเลขสมมติเพื่อการจำลอง ถ้าหยุดเวลาไว้ ช่างจะยังไม่เดินทาง</p>`}
$('#sheetBody').addEventListener('click',e=>{const f=e.target.closest('[data-f]'),t=e.target.closest('[data-tech]');
if(f){const k=f.dataset.f;if(S.fault===k){S.fault=null;S.tech=null;toast('ล้างอาการแล้ว · ระบบกลับมาปกติ',2200)}else{S.fault=k;S.tech=null;toast('เกิดอาการ: '+REP[k].n,2600)}syncFault();$('#sheetBody').innerHTML=faultHTML();return}
if(t&&S.fault&&!S.tech){S.tech={left:REP[S.fault].h,total:REP[S.fault].h};toast('เรียกช่างแล้ว · ถึงใน ~'+REP[S.fault].h+' ชม. (เวลาในเกม)',3000);syncFault();$('#sheetBody').innerHTML=faultHTML()}});
function popAt(text,cls,wp){const el=document.createElement('div');el.className='pop '+cls;el.textContent=text;_tv.copy(wp).project(cam);
el.style.setProperty('--x',((_tv.x*.5+.5)*W+(Math.random()*34-17)).toFixed(0)+'px');el.style.setProperty('--y',((-_tv.y*.5+.5)*H).toFixed(0)+'px');$('#labels').appendChild(el);setTimeout(()=>el.remove(),1600)}
function pops(){ORDER.forEach(m=>{const L=LG[m],I=isl[m],act=m===S.mode&&!S.over&&m!=='off';
if(!act){L.popB=0;L.popS=0;return}
if(L.popB>=8){popAt('−'+baht(L.popB),'m',I.tGrid.w);L.popB=0}if(L.popS>=8){popAt('+'+baht(L.popS),'p',I.tGrid.w);L.popS=0}})}
function monthClose(){const n=Math.floor((S.day-1)/30),m=S.mode,L=LG[m];
const msg=m==='off'?`สรุปเดือนที่ ${n} · ออฟกริดไม่มีบิลค่าไฟหลวง ฿0`:`บิลเดือนที่ ${n} · ซื้อ ${baht(L.mBuy)} − ขาย ${baht(L.mSell)} = ${L.mBuy>=L.mSell?'จ่ายสุทธิ ':'ได้รับสุทธิ '}${baht(Math.abs(L.mBuy-L.mSell))}`;
toast(msg,6500);ORDER.forEach(k=>{const l=LG[k];l.mBuy=l.mSell=l.mBase=l.mRep=l.mImp=l.mLoad=0})}
function finishRepair(){const F=S.fault,r=REP[F];ORDER.forEach(m=>{const c=r.c[m];if(c){LG[m].rep+=c;LG[m].mRep+=c}});
const c=r.c[S.mode],tw=isl[S.mode].tF.w.clone();S.fault=null;S.tech=null;toast('ช่างซ่อมเสร็จแล้ว · ระบบกลับมาทำงาน'+(c?` · ค่าซ่อม ${baht(c)}`:''),4200);if(c&&!S.over)popAt('−'+baht(c),'m',tw);syncFault()}
let refreshN=0;
/* ================= HUD ================= */
const sgn=n=>(Math.round(n)<0?'−':'+')+baht(Math.abs(n));
function hud(){const m=S.mode,s=SIM[m],d=MODE[m],L=LG[m];
gv[0].textContent=f1(s.pv)+' kW';gv[1].textContent=f1(s.load)+' kW';
let live='';const warn=[false,false,false,false];
if(m==='on'){gv[2].textContent='ไม่มี';gl[2].textContent='ไม่มีแบตเตอรี่';gv[3].textContent=S.out?'ดับ':s.grid<-.1?'ขาย '+f1(-s.grid):s.grid>.1?'ซื้อ '+f1(s.grid):'พอดี';gl[3].textContent='ไฟหลวง (kW)';
live=S.out?'ไฟหลวงดับ · ระบบหยุดเองเพื่อความปลอดภัย ไม่มีไฟใช้':s.grid<-.1?`ผลิตเกินใช้ · ขายไฟคืน ${f1(-s.grid)} kW`:s.grid>.1&&s.pv>.15?`แดดไม่พอ · ดึงไฟหลวงเสริม ${f1(s.grid)} kW`:s.grid>.1?`ไม่มีแดด · ใช้ไฟหลวง ${f1(s.grid)} kW`:'ผลิตพอดีกับที่ใช้';warn[3]=S.out}
else{gv[2].textContent=Math.round(s.soc*100)+'%';gl[2].textContent=s.bat>.1?'กำลังชาร์จ':s.bat<-.1?'กำลังจ่ายไฟ':'แบตเตอรี่';warn[2]=s.soc<.15;
if(m==='off'){gv[3].textContent='ไม่เชื่อม';gl[3].textContent='ไฟหลวง';
live=s.served<.9?'แบตหมด · ไฟไม่พอใช้ (แบตต้องออกแบบให้พอ)':S.out?'ไฟหลวงดับ · ไม่กระทบ เพราะไม่ได้ใช้ไฟหลวง':s.bat<-.1?`ใช้ไฟจากแบตเตอรี่ ${f1(-s.bat)} kW`:s.bat>.1?`ชาร์จแบตเตอรี่ ${f1(s.bat)} kW`:'แบตเต็ม · ผลิตพอดีกับที่ใช้';warn[0]=false}
else{gv[3].textContent=S.out?'ดับ':s.grid<-.1?'ขาย '+f1(-s.grid):s.grid>.1?'ซื้อ '+f1(s.grid):'พอดี';gl[3].textContent='ไฟหลวง (kW)';warn[3]=S.out;
live=s.served<.9?'ไฟหลวงดับและแบตหมด · ไฟไม่พอใช้':S.out?`ไฟหลวงดับ · สลับใช้แบตสำรอง ${f1(Math.max(0,-s.bat))} kW อัตโนมัติ`:s.bat<-.1?`ใช้ไฟจากแบตเตอรี่ ${f1(-s.bat)} kW`:s.bat>.1?`ชาร์จแบต ${f1(s.bat)} kW${s.grid<-.1?` · ขายคืน ${f1(-s.grid)} kW`:''}`:s.grid>.1?`ซื้อไฟหลวง ${f1(s.grid)} kW`:s.grid<-.1?`ขายไฟคืน ${f1(-s.grid)} kW`:'ผลิตพอดีกับที่ใช้'}}
live=faultLine(m)||live;gEls.forEach((e,i)=>e.classList.toggle('warn',warn[i]));$('#live').textContent=live;
$('#lcB').textContent=m==='off'?'฿0':'−'+baht(L.buy);$('#lcS').textContent=m==='off'?'–':'+'+baht(L.sell);$('#lcV').textContent=sgn(s.saved);
const net=L.sell-L.buy-L.rep,mo=$('#money');mo.innerHTML=ic('coin')+sgn(net);mo.className='money '+(net>=0?'pos':'neg');mo.title='สุทธิ = ขายไฟ − ซื้อไฟ − ค่าซ่อม';
$('#rate').textContent=m==='on'?`ซื้อ ฿${(RATE.avg*RATE.vat).toFixed(2)}/หน่วย (ค่าไฟเฉลี่ย ${RATE.avg} + VAT 7%) · ขายคืน ฿${RATE.sell.toFixed(2)}/หน่วย`:m==='hyb'?`ซื้อ ฿${L.price.toFixed(2)}/หน่วย (บ้านอยู่อาศัย ใช้ไปแล้ว ${Math.round(L.mImp)} หน่วยเดือนนี้) · ขายคืน ฿${RATE.sell.toFixed(2)}`:'ไม่เชื่อมไฟหลวง · ค่าไฟหลวง ฿0 ทุกเดือน';
syncFault();if(curSheet==='fault'&&++refreshN%4===0){const el=$('#fltLive');if(el)el.innerHTML=faultLive()}
const hh=Math.floor(S.T),mm=Math.floor((S.T-hh)*60);$('#clk').innerHTML=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} น.<small>วันที่ ${S.day}</small>`;
if(document.activeElement!==$('#tm'))$('#tm').value=S.T}

/* ================= tags projection ================= */
const _tv=new V3();
function updTags(){tags.forEach(t=>{let vis=t.only==='ov'?S.over:(!S.over&&t.mode===S.mode);if(vis&&t.cond&&!t.cond())vis=false;
t.el.classList.toggle('hide',!vis);if(!vis)return;
_tv.copy(t.w).project(cam);const x=(_tv.x*.5+.5)*W,y=(-_tv.y*.5+.5)*H;t.el.style.transform=`translate(${x.toFixed(1)}px,${(y-8).toFixed(1)}px) translate(-50%,-100%)${t.rot?` rotate(${t.rot}deg)`:''}`})}

/* ================= loop ================= */
let last=performance.now(),time=0,hudT=0,prevT=S.T;const _cc=new THREE.Color();
function frame(now){requestAnimationFrame(frame);
const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
if(S.play){S.T+=dt*(24/DAY_SEC)*S.speed;if(S.T>=24){S.T-=24;S.day++;if((S.day-1)%30===0)monthClose()}}
let dT=S.T-prevT;if(dT<-12)dT+=24;prevT=S.T;if(dT<0||dT>1)dT=0;
if(S.tech&&dT>0){S.tech.left-=dT;if(S.tech.left<=0)finishRepair()}
stepSim(dT,dt);updEnv(dt);
pingT=Math.min(1,pingT+dt*1.6);ping.material.opacity=(1-pingT)*.9;ping.scale.setScalar(1+pingT*2.2);
ORDER.forEach(m=>{const I=isl[m];I.lit+=(I.litT-I.lit)*(1-Math.exp(-dt*4));const n=envState.night,F=S.fault;
I.win.color.copy(cDay).lerp(cDark,n*.9);I.win.emissive.copy(cLit).multiplyScalar(I.lit*(.1+.85*n));
const k=I.lit*n;I.lampMat.color.setRGB(lerp(.72,1,k),lerp(.74,.88,k),lerp(.78,.5,k));
I.apply(dt,time);for(const f in I.F)I.F[f].update(dt);
if(F==='inv')I.led.color.setHex(0xE5484D);
if(F==='bat'&&I.bars)I.bars.forEach((b,i)=>b.color.setHex(((Math.floor(time*4)+i)%2)?0xE5484D:0x3A2A2A));
I.fx(dt,time);const e=envState.day*wxs;I.pm.emissive.setRGB(.02+.1*e,.05+.2*e,.16+.35*e);I.pm.color.lerp(_cc.setHex(F==='pv'?0x7E8799:0xFFFFFF),.1)});
faultTags();pops();updWeather(dt);updateCam(dt);R.render(scene,cam);updTags();
hudT+=dt;if(hudT>.15){hudT=0;hud()}}

/* ---- init ---- */
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(dockEl);
$('#ledger').innerHTML='<div class="lc buy"><span>ซื้อไฟหลวง</span><b id="lcB"></b></div><div class="lc sell"><span>ขายไฟคืน</span><b id="lcS"></b></div><div class="lc"><span>ประหยัดแล้ว</span><b id="lcV"></b></div>';
$('#fltBtn').onclick=()=>openSheet('fault');
resize();syncWx();setPlayIcon();setMode('on',true);view.tgt.copy(view.tgtGoal);$('#prin').textContent=MODE.on.principle;
hud();requestAnimationFrame(frame);
setTimeout(()=>toast('ลาก = หมุน · บีบ = ซูม · แตะอุปกรณ์ = ดูรายละเอียด · ลองกด “จำลองไฟหลวงดับ”',5200),900);
})();
</script>
